name: Create Plugin Release

on:
  pull_request:
    types:
      - closed
    branches:
      - 'trunk'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Release PR number to (re)deploy'
        required: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ( github.event.pull_request.merged == true && startsWith( github.head_ref, 'release/' ) )
    runs-on: ubuntu-latest
    name: Blog Voyeur Release
    # The default GITHUB_TOKEN is read-only on repos that don't opt into
    # read-write workflow permissions. This release job pushes commits and tags,
    # creates a GitHub release, and comments on the PR, so grant those writes
    # explicitly rather than relying on the repo/org default.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      # The release PR number: from the merge event, or the workflow_dispatch input.
      PR: ${{ github.event.number || inputs.pr }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          # Check out the base branch (trunk) as a real local branch, not the
          # detached-HEAD merge ref, so create-release.mjs can `git push origin HEAD`.
          # (github.base_ref is empty for workflow_dispatch, so fall back to the ref.)
          ref: ${{ github.base_ref || github.ref_name }}
      - name: Comment on PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ env.PR }} --body "🚀 **[Release workflow started](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Setup Git
        run: |
          git config user.name "Blog Voyeur Bot"
          git config user.email "<donncha@ocaoimh.ie>"
      - name: Create Release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/create-release.mjs ${{ env.PR }}
      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion
      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.WORDPRESSORG_SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.WORDPRESSORG_SVN_USERNAME }}
          BUILD_DIR: build/blog-voyeur
          SLUG: blog-voyeur
          VERSION: ${{ steps.create_release.outputs.version }}
      - name: Comment on PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ env.PR }} --body "🚀 Release **${{ steps.create_release.outputs.version }}** pushed to WordPress.org — [confirm the release email](https://wordpress.org/plugins/blog-voyeur/advanced/) to publish it to users."
